<div class="navbar bg-base-100 shadow-sm rounded-xl">
  <div class="flex w-full justify-between">

    <div class="flex">
      <div class="avatar w-10">
        <img
        alt="Elefant Notify"
        src="assets/images/logo.svg" />
      </div>
      <h1 class="font-bold text-xl self-end">Meine Erinnerungen</h1>
    </div>
    <div class="flex gap-2">
      <label class="label gap-2">
        Nur Entwürfe
        <input
          type="checkbox"
          class="toggle"
          aria-label="Nur Entwuerfe anzeigen"
          (change)="this.onDraftsOnlyChanged($event)" />
      </label>
      <input
        type="text"
        placeholder="Suche nach Titel"
        class="input input-bordered w-24 md:w-auto"
        (input)="this.onSearchTermChanged($event)" />
    </div>
  </div>
</div>
