<reme-content-frame>
  <div class="max-w-md">
    <h1 class="text-xl md:text-3xl xl:text-4xl font-bold">{{ this.currentSlogan().title}}</h1>
    <div class="md:py-4 xl:py-6 py-3 text-sm md:text-base xl:text-lg 2xl:text-xl">
      <p>{{ this.currentSlogan().description }}</p>
      <br/>
      <p>{{ this.currentSlogan().fazit }}</p>
    </div>
    <progress class="progress w-full md:w-48 xl:w-56" [value]="this.progressPercentage()" max="100"></progress>
  </div>
</reme-content-frame>
