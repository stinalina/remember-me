<reme-content-frame>
  <div class="max-w-md">
    <h1 class="md:text-3xl xl:text-4xl text-2xl font-bold">Einloggen & <br/> Dran bleiben!</h1>
    <form
      class="md:py-4 xl:py-6 py-3 flex flex-col gap-3"
      (submit)="$event.preventDefault(); !(mail.mailControl.invalid || pw.passwordControl.invalid) &&
        this.login(mail.mailControl.value!, pw.passwordControl.value!, this.rememberMeFlag)">
      <reme-mail preId="login" #mail></reme-mail>
      <reme-password preId="login" #pw></reme-password>
      <reme-checkbox preId="login-remember-me" [(value)]="this.rememberMeFlag">
        Angemeldet bleiben
      </reme-checkbox>
      <button class="btn btn-md w-full" type="submit"
        [disabled]="mail.mailControl.invalid || pw.passwordControl.invalid || this.isLoading()">
        @if (this.isLoading()) {
          <span class="loading loading-spinner"></span>
        }
        Einloggen
      </button>
      <button class="btn-ghost reme-link"
        type="button"
        [disabled]="mail.mailControl.invalid" 
        (click)="forgetPassword(mail.mailControl.value)">
        Passwort vergessen?
      </button>
    </form>
    <span>👉 Noch nicht dabei? <button class="btn-ghost reme-link" type="button" (click)="requestRegistration.emit()">Werde Mitglied</button>!</span>
  </div>
</reme-content-frame>
