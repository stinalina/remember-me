mutation InsertNotification($object: Notification_insert_input!) {
  insert_Notification(objects: [$object]) {
    returning {
      Content
      CreatedAt
      DueDate
      Id
      IsDraft
      UserId
      Subject
      RememberCount
      Mail,
      IsArchived
    }
  }
}

mutation UpdateNotificationById($id: uuid!, $object: Notification_set_input!) {
  update_Notification_by_pk(pk_columns: {Id: $id}, _set: $object) {
    Content
    CreatedAt
    DueDate
    Id
    IsDraft
    UserId
    Subject
    RememberCount
    Mail,
    IsArchived
  }
}

mutation DeleteNotificationById($id: uuid!) {
  delete_Notification_by_pk(Id: $id) {
    Id
  }
}

query GetNotificationByUserId($userId: uuid) {
  Notification(order_by: {CreatedAt: desc}, where: {UserId: {_eq: $userId}}) {
    Content
    CreatedAt
    Subject
    RememberCount
    Id
    DueDate
    Mail,
    IsDraft,
    IsArchived
  }
}
